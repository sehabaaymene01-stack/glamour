<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glamour Bons</title>
<meta name="description" content="Track supplier delivery notes, payments and due dates.">
<meta name="theme-color" content="#8e2157">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glamour">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app"></main>

<button id="fab" class="fab" data-act="new-note" aria-label="New">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
</button>

<nav id="nav" class="nav">
  <a href="#/home" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span data-t="tabHome"></span>
  </a>
  <a href="#/notes" data-tab="notes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1zM9 8h6M9 12h6"/></svg><span data-t="tabNotes"></span>
  </a>
  <a href="#/suppliers" data-tab="suppliers">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.900 1.900 6.500 5.500M16 4.800a3.500 3.500 0 0 1 0 6.400M18 14.800c2 .700 3.200 2.400 3.600 5.200"/></svg><span data-t="tabSuppliers"></span>
  </a>
  <a href="#/settings" data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span data-t="tabSettings"></span>
  </a>
</nav>

<dialog id="sheet" class="sheet"><form id="sheet-form" novalidate></form></dialog>
<dialog id="viewer" class="viewer"><img alt=""><button type="button" data-act="close-viewer" aria-label="Close">×</button></dialog>

<script src="app.js"></script>
</body>
</html>
